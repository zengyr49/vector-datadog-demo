# Vector Helm Chart 默认配置

# Vector版本
image:
  repository: timberio/vector
  tag: "0.32.0-alpine"
  pullPolicy: IfNotPresent

# 服务账户配置
serviceAccount:
  create: true
  name: "vector"
  annotations: {}

# RBAC配置
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces"]
      verbs: ["get", "list", "watch"]

# DaemonSet配置
daemonSet:
  enabled: true
  replicas: 1
  
  # 资源限制
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

  # 节点选择器
  nodeSelector: {}
  
  # 容忍度
  tolerations:
    - key: node-role.kubernetes.io/master
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule

# Vector配置
config:
  # 数据目录
  data_dir: "/vector-data-dir"
  
  # API配置
  api:
    enabled: true
    address: "0.0.0.0:8686"
    port: 8686
  
  # 日志级别
  log_schema:
    level_key: "level"
    message_key: "message"
    timestamp_key: "timestamp"
  
  # 源配置
  sources:
    kubernetes_logs:
      type: "kubernetes_logs"
      glob_minimum_cooldown_ms: 1000
  
  # 转换配置
  transforms:
    parse_logs:
      type: "remap"
      inputs: ["kubernetes_logs"]
      source: |
        . = parse_json!(.message)
        .timestamp = now()
        .service = "vector-demo"
        .level = upcase(.level)
  
  # 输出配置
  sinks:
    console:
      type: "console"
      inputs: ["parse_logs"]
      encoding:
        codec: "json"
        timestamp_format: "rfc3339"
    
    # 可选：输出到文件
    file_output:
      type: "file"
      inputs: ["parse_logs"]
      path: "/var/log/vector/output.log"
      encoding:
        codec: "json"
        timestamp_format: "rfc3339"

# 持久化存储
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# 服务配置
service:
  type: ClusterIP
  port: 8686
  targetPort: 8686

# 监控配置
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
