apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.fullname" . }}-config
  labels:
    {{- include "vector.labels" . | nindent 4 }}
data:
  vector.yaml: |
    # Vector配置文件
    data_dir: {{ .Values.config.data_dir }}
    
    # API配置
    api:
      enabled: {{ .Values.config.api.enabled }}
      address: "{{ .Values.config.api.address }}"
      port: {{ .Values.config.api.port }}
    
    # 日志模式配置
    log_schema:
      level_key: "{{ .Values.config.log_schema.level_key }}"
      message_key: "{{ .Values.config.log_schema.message_key }}"
      timestamp_key: "{{ .Values.config.log_schema.timestamp_key }}"
    
    # 源配置
    sources:
      kubernetes_logs:
        type: "kubernetes_logs"
        glob_minimum_cooldown_ms: {{ .Values.config.sources.kubernetes_logs.glob_minimum_cooldown_ms }}
    
    # 转换配置
    transforms:
      parse_logs:
        type: "remap"
        inputs: ["kubernetes_logs"]
        source: |
          # 解析JSON日志
          if exists(.message) {
            . = merge(., parse_json!(.message))
          }
          
          # 添加时间戳
          .timestamp = now()
          
          # 添加服务标识
          .service = "{{ .Values.config.transforms.parse_logs.service | default "vector-demo" }}"
          
          # 标准化日志级别
          if exists(.level) {
            .level = upcase(.level)
          }
          
          # 添加Kubernetes元数据
          if exists(.kubernetes) {
            .pod_name = .kubernetes.pod_name
            .namespace = .kubernetes.namespace_name
            .container_name = .kubernetes.container_name
          }
          
          # 添加主机信息
          .host = get_hostname!()
          
          # 清理字段
          del(.kubernetes)
    
    # 输出配置
    sinks:
      console:
        type: "console"
        inputs: ["parse_logs"]
        encoding:
          codec: "json"
          timestamp_format: "{{ .Values.config.sinks.console.encoding.timestamp_format }}"
      
      # 文件输出（可选）
      {{- if .Values.config.sinks.file_output.enabled }}
      file_output:
        type: "file"
        inputs: ["parse_logs"]
        path: "{{ .Values.config.sinks.file_output.path }}"
        encoding:
          codec: "{{ .Values.config.sinks.file_output.encoding.codec }}"
          timestamp_format: "{{ .Values.config.sinks.file_output.encoding.timestamp_format }}"
      {{- end }}
