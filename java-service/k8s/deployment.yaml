apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-demo-service
  labels:
    app: vector-demo-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-demo-service
  template:
    metadata:
      labels:
        app: vector-demo-service
        version: v1
    spec:
      containers:
      - name: vector-demo-service
        image: vector-demo-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        - name: LOGGING_LEVEL_ROOT
          value: "INFO"
        - name: LOGGING_LEVEL_COM_EXAMPLE_VECTORDEMO
          value: "DEBUG"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/logs/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/logs/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vector-demo-service
  labels:
    app: vector-demo-service
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: vector-demo-service
