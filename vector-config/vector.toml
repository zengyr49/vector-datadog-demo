# Vector配置文件 - 用于收集Java服务日志

# 全局配置
data_dir = "/vector-data-dir"

# API配置
[api]
enabled = true
address = "0.0.0.0:8686"

# 日志模式配置
[schema]
level_key = "level"
message_key = "message"
timestamp_key = "timestamp"

# 源配置 - 收集Kubernetes Pod日志
[sources.kubernetes_logs]
type = "kubernetes_logs"
glob_minimum_cooldown_ms = 1000

# 源配置 - 收集容器标准输出日志
[sources.container_logs]
type = "file"
include = ["/var/log/containers/*.log"]
read_from = "beginning"

# 转换配置 - 解析JSON日志
[transforms.parse_json_logs]
type = "remap"
inputs = ["kubernetes_logs"]
source = '''
# 尝试解析JSON格式的日志
if exists(.message) {
  parsed = parse_json!(.message)
  if exists(parsed) {
    . = merge(., parsed)
  }
}

# 添加时间戳
.timestamp = now()

# 添加服务标识
.service = "vector-demo"

# 标准化日志级别
if exists(.level) {
  .level = upcase(.level)
}

# 添加Kubernetes元数据
if exists(.kubernetes) {
  .pod_name = .kubernetes.pod_name
  .namespace = .kubernetes.namespace_name
  .container_name = .kubernetes.container_name
}
'''

# 转换配置 - 过滤和增强日志
[transforms.filter_logs]
type = "filter"
inputs = ["parse_json_logs"]
condition = '''
# 只处理vector-demo相关的日志
exists(.service) && .service == "vector-demo"
'''

# 转换配置 - 添加业务字段
[transforms.add_business_fields]
type = "remap"
inputs = ["filter_logs"]
source = '''
# 添加业务相关字段
.business_unit = "demo"
.environment = "kubernetes"

# 如果是错误日志，添加错误分类
if exists(.level) && .level == "ERROR" {
  .error_category = "application_error"
  .severity = "high"
}

# 如果是业务日志，添加业务类型
if exists(.message) {
  if contains(.message, "订单") {
    .business_type = "order"
  } else if contains(.message, "支付") {
    .business_type = "payment"
  } else if contains(.message, "库存") {
    .business_type = "inventory"
  } else {
    .business_type = "general"
  }
}
'''

# 输出配置 - 控制台输出（用于调试）
[sinks.console_output]
type = "console"
inputs = ["add_business_fields"]
encoding.codec = "json"
encoding.timestamp_format = "rfc3339"

# 输出配置 - 文件输出
[sinks.file_output]
type = "file"
inputs = ["add_business_fields"]
path = "/var/log/vector/processed-logs.log"
encoding.codec = "json"
encoding.timestamp_format = "rfc3339"

