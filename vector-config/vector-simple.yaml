# Vector 简化配置文件 - 专门收集 vector-demo-service 的日志

# 全局配置
data_dir: "/vector-data-dir"

# API 配置
api:
  enabled: true
  address: "0.0.0.0:8686"

# 日志模式配置
schema:
  level_key: "level"
  message_key: "message"
  timestamp_key: "timestamp"

# 源配置：收集 Kubernetes 日志
sources:
  kubernetes_logs:
    type: "kubernetes_logs"
    glob_minimum_cooldown_ms: 1000

# 转换配置：解析和增强日志
transforms:
  parse_and_enhance:
    type: "remap"
    inputs: ["kubernetes_logs"]
    source: |
      # 尝试解析 JSON 格式的日志
      if exists(.message) {
        parsed = parse_json!(.message)
        if exists(parsed) {
          . = merge(., parsed)
        }
      }
      
      # 添加时间戳
      .timestamp = now()
      
      # 添加服务标识
      .service = "vector-demo-service"
      .business_service = "vector-demo"
      
      # 标准化日志级别
      if exists(.level) {
        .level = upcase(.level)
      }
      
      # 添加 Kubernetes 元数据
      if exists(.kubernetes) {
        .pod_name = .kubernetes.pod_name
        .namespace = .kubernetes.namespace_name
        .container_name = .kubernetes.container_name
      }
      
      # 添加业务相关字段
      .business_unit = "demo"
      .environment = "kubernetes"
      .collection_timestamp = now()
      
      # 如果是错误日志，添加错误分类
      if exists(.level) && .level == "ERROR" {
        .error_category = "application_error"
        .severity = "high"
      }
      
      # 如果是业务日志，添加业务类型
      if exists(.message) {
        if contains(.message, "订单") {
          .business_type = "order"
        } else if contains(.message, "支付") {
          .business_type = "payment"
        } else if contains(.message, "库存") {
          .business_type = "inventory"
        } else {
          .business_type = "general"
        }
      }
      
      # 添加日志来源信息
      .log_source = "vector-demo-service"
      .log_collector = "vector-agent"

  # 转换配置：过滤只保留 vector-demo 相关日志
  filter_demo_logs:
    type: "filter"
    inputs: ["parse_and_enhance"]
    condition: |
      # 只处理 vector-demo 相关的日志
      exists(.business_service) && .business_service == "vector-demo"

# 输出配置 1: 控制台输出（用于调试和实时监控）
sinks:
  console_output:
    type: "console"
    inputs: ["filter_demo_logs"]
    encoding:
      codec: "json"
      timestamp_format: "rfc3339"

  # 输出配置 2: 文件输出（持久化存储）
  file_output:
    type: "file"
    inputs: ["filter_demo_logs"]
    path: "/var/log/vector/vector-demo-logs.log"
    encoding:
      codec: "json"
      timestamp_format: "rfc3339"
