# Vector 配置文件 - 专门收集 vector-demo-service 的日志

# 全局配置
data_dir = "/vector-data-dir"

# API 配置
[api]
enabled = true
address = "0.0.0.0:8686"

# 日志模式配置
[schema]
level_key = "level"
message_key = "message"
timestamp_key = "timestamp"

# 源配置 1: 收集指定 Pod 的容器日志
[sources.java_service_logs]
type = "kubernetes_logs"
glob_minimum_cooldown_ms = 1000
# 只收集特定 namespace 和 pod 的日志
exclude_paths = ["/var/log/containers/*"]
include_paths = ["/var/log/containers/vector-demo-service-*_vector-service-demo_*.log"]

# 源配置 2: 收集文件日志（如果容器内日志文件需要收集）
[sources.file_logs]
type = "file"
include = ["/var/log/containers/vector-demo-service-*_vector-service-demo_*.log"]
read_from = "beginning"
# 添加 Kubernetes 元数据
kubernetes_logs_source = "kubernetes_logs"

# 转换配置 1: 解析 JSON 日志
[transforms.parse_json_logs]
type = "remap"
inputs = ["java_service_logs"]
source = '''
# 尝试解析 JSON 格式的日志
if exists(.message) {
  parsed = parse_json!(.message)
  if exists(parsed) {
    . = merge(., parsed)
  }
}

# 添加时间戳
.timestamp = now()

# 添加服务标识
.service = "vector-demo-service"
.source_type = "kubernetes_logs"

# 标准化日志级别
if exists(.level) {
  .level = upcase(.level)
}

# 添加 Kubernetes 元数据
if exists(.kubernetes) {
  .pod_name = .kubernetes.pod_name
  .namespace = .kubernetes.namespace_name
  .container_name = .kubernetes.container_name
  .pod_id = .kubernetes.pod_id
}

# 添加业务标识
.business_service = "vector-demo"
.collection_method = "kubernetes_logs"
'''

# 转换配置 2: 解析文件日志
[transforms.parse_file_logs]
type = "remap"
inputs = ["file_logs"]
source = '''
# 尝试解析 JSON 格式的日志
if exists(.message) {
  parsed = parse_json!(.message)
  if exists(parsed) {
    . = merge(., parsed)
  }
}

# 添加时间戳
.timestamp = now()

# 添加服务标识
.service = "vector-demo-service"
.source_type = "file_logs"

# 标准化日志级别
if exists(.level) {
  .level = upcase(.level)
}

# 添加业务标识
.business_service = "vector-demo"
.collection_method = "file_logs"
'''

# 转换配置 3: 合并所有日志源
[transforms.merge_logs]
type = "remap"
inputs = ["parse_json_logs", "parse_file_logs"]
source = '''
# 合并来自不同源的日志
# 保持原有字段不变
'''

# 转换配置 4: 过滤和增强日志
[transforms.enhance_logs]
type = "remap"
inputs = ["merge_logs"]
source = '''
# 添加业务相关字段
.business_unit = "demo"
.environment = "kubernetes"
.collection_timestamp = now()

# 如果是错误日志，添加错误分类
if exists(.level) && .level == "ERROR" {
  .error_category = "application_error"
  .severity = "high"
  .alert_level = "critical"
}

# 如果是警告日志，添加警告分类
if exists(.level) && .level == "WARN" {
  .warning_category = "application_warning"
  .severity = "medium"
  .alert_level = "warning"
}

# 如果是业务日志，添加业务类型
if exists(.message) {
  if contains(.message, "订单") {
    .business_type = "order"
    .business_domain = "ecommerce"
  } else if contains(.message, "支付") {
    .business_type = "payment"
    .business_domain = "finance"
  } else if contains(.message, "库存") {
    .business_type = "inventory"
    .business_domain = "warehouse"
  } else if contains(.message, "用户") {
    .business_type = "user"
    .business_domain = "identity"
  } else {
    .business_type = "general"
    .business_domain = "system"
  }
}

# 添加日志来源信息
.log_source = "vector-demo-service"
.log_collector = "vector-agent"
'''

# 转换配置 5: 过滤只保留 vector-demo 相关日志
[transforms.filter_demo_logs]
type = "filter"
inputs = ["enhance_logs"]
condition = '''
# 只处理 vector-demo 相关的日志
exists(.business_service) && .business_service == "vector-demo"
'''

# 输出配置 1: 控制台输出（用于调试和实时监控）
[sinks.console_output]
type = "console"
inputs = ["filter_demo_logs"]
encoding.codec = "json"
encoding.timestamp_format = "rfc3339"

# 输出配置 2: 文件输出（持久化存储）
[sinks.file_output]
type = "file"
inputs = ["filter_demo_logs"]
path = "/var/log/vector/vector-demo-logs.log"
encoding.codec = "json"
encoding.timestamp_format = "rfc3339"
# 文件轮转配置
[file_output.acknowledgements]
enabled = true

# 输出配置 3: 生成 Vector 内部指标（用于监控 Vector 自身）
[sinks.internal_metrics]
type = "internal_metrics"
inputs = ["filter_demo_logs"]
# 每 10 秒生成一次指标
interval = 10

# 输出配置 4: 日志统计指标（可选，用于监控日志量）
[sinks.log_stats]
type = "prometheus"
inputs = ["filter_demo_logs"]
endpoint = "0.0.0.0:9090"
metrics:
  - name: "vector_demo_logs_total"
    type: "counter"
    description: "Total number of vector-demo logs collected"
    labels:
      - "level"
      - "business_type"
      - "namespace"
      - "pod_name"
  
  - name: "vector_demo_error_logs_total"
    type: "counter"
    description: "Total number of error logs from vector-demo"
    labels:
      - "business_type"
      - "namespace"
      - "pod_name"
  
  - name: "vector_demo_logs_by_level"
    type: "counter"
    description: "Logs count by level"
    labels:
      - "level"
      - "business_type"
